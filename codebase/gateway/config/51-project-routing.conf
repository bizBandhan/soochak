map $request_uri $service_route {
    default backend:3000;
    # ~^/webhook backend:3000;
    # ~^/admin/ backend:3000; # disable in production
    # ~^/pravah/ pravah:3000;
    # ~^/js/pravah-sdk.js pravah:3000;
    # ~^/public pravah:3000; # disable after setup is complete
    # ~^/api/v1/register pravah:3000; # disable after setup is complete
    # ~^/api/ backend:3000;
}

map $env $frontend_service {
    prod backend:80;
    dev backend:3000;
}

map $service_route $upstream {
    backend $frontend_service;
    default $service_route;
}
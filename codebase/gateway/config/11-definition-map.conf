map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

map $scheme $hsts_header {
    https "max-age=63072000; preload";
}
map $host $env {
    hostnames;
    default                          prod;

    soochak.optiwari.duckdns.org     dev;
    *.soochak.optiwari.duckdns.org   dev;
    *.bizbandhan.com                 prod;
}
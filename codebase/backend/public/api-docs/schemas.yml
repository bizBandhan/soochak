components:
  schemas:
    LoginRequest:
      type: object
      additionalProperties: false
      required: [user, password]
      properties:
        user: { type: string, description: 'Username, unique within the assigned Soochak hostname.' }
        password: { type: string, format: password }
    LoginResponse:
      type: object
      required: [authenticated, user]
      description: The session token is never returned in the body; it is set as the httpOnly `authorization` cookie.
      properties:
        authenticated: { type: boolean, const: true }
        expiresAt: { type: string, format: date-time }
        user: { $ref: '#/components/schemas/UserDetails' }
    AuthAndUser:
      type: object
      required: [authenticated, user]
      properties:
        authenticated: { type: boolean, const: true }
        user: { $ref: '#/components/schemas/UserDetails' }
    UserDetails:
      type: object
      required: [_id, user, email]
      properties:
        _id: { type: string }
        user: { type: string }
        email: { type: string, format: email }
        name:
          type: object
          properties:
            salutation: { type: string }
            first: { type: string }
            middle: { type: string }
            last: { type: string }
        sex: { type: string, enum: [Male, Female, Other] }
        phone: { type: string, description: E.164 format. }
        timezone: { type: string }
        profilePicture: { type: string }
        role: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        organization:
          type: string
          description: Organization associated with the user's canonical origin.
    ChangePasswordRequest:
      type: object
      additionalProperties: false
      required: [currentPassword, newPassword]
      properties:
        currentPassword: { type: string, format: password }
        newPassword: { type: string, format: password, minLength: 8 }
    UpdateProfileRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      description: Blank phone, timezone or profilePicture clears the value. Role, password, dob and sex cannot be changed here.
      properties:
        name:
          type: object
          additionalProperties: false
          properties:
            salutation: { type: string }
            first: { type: string, minLength: 1 }
            middle: { type: string }
            last: { type: string, minLength: 1 }
        email: { type: string, format: email, description: Domain must have an MX record. }
        phone: { type: string, description: E.164 format, e.g. +919876543210. }
        timezone: { type: string, description: IANA timezone, e.g. Asia/Kolkata. }
        profilePicture: { type: string, format: uri, maxLength: 2048 }
    UserUpdateInput:
      type: object
      additionalProperties: false
      minProperties: 1
      description: Username and password cannot be changed here.
      properties:
        role: { type: string }
        name: { $ref: '#/components/schemas/UpdateProfileRequest/properties/name' }
        sex: { type: string, enum: [Male, Female, Other] }
        dob: { type: string, format: date }
        email: { type: string, format: email }
        phone: { type: string }
        timezone: { type: string }
        profilePicture: { type: string, format: uri, maxLength: 2048 }
    Message:
      type: object
      properties:
        message: { type: string }
    CrudListResponse:
      type: object
      properties:
        status: { type: string }
        message: { type: string }
        data:
          type: array
          items: { type: object, additionalProperties: true }
    CrudItemResponse:
      type: object
      properties:
        status: { type: string }
        message: { type: string }
        data: { type: object, additionalProperties: true }
    OrganizationInput:
      type: object
      additionalProperties: false
      required: [name, slug]
      description: The user's workspace hostname is derived from the slug and server-configured HOSTED_DOMAIN; it cannot be supplied in this body. The customer website origin is separate.
      properties:
        name: { type: string }
        slug: { type: string, pattern: '^[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?$', description: Lowercase DNS label used as the workspace hostname prefix; reserved labels are rejected. }
        plan: { type: string, enum: [free, growth, scale], default: free, description: Selects the quotas; limits are derived server-side. }
        limits: { type: object, additionalProperties: true, readOnly: true, description: Ignored on input; derived from plan. }
        owner:
          type: object
          required: [user, name, sex, dob, email, password]
          properties:
            user: { type: string }
            name:
              type: object
              required: [first, last]
              properties:
                salutation: { type: string }
                first: { type: string }
                middle: { type: string }
                last: { type: string }
            sex: { type: string, enum: [Male, Female, Other] }
            dob: { type: string, format: date }
            email: { type: string, format: email }
            phone: { type: string }
            timezone: { type: string }
            profilePicture: { type: string, format: uri }
            password: { type: string, format: password }
    OrganizationRecord:
      type: object
      properties:
        _id: { type: string }
        name: { type: string }
        slug: { type: string }
        origin: { type: string }
        workspaceHost: { type: string, format: hostname }
        workspaceUrl: { type: string, format: uri, description: HTTPS URL where the owner must sign in. }
        limits: { type: object, additionalProperties: true }
    OrganizationRegistrationRequest:
      allOf:
        - $ref: '#/components/schemas/OrganizationInput'
        - type: object
          required: [owner]
    OrganizationListResponse:
      type: object
      properties:
        status: { type: string }
        message: { type: string }
        data:
          type: array
          items: { $ref: '#/components/schemas/OrganizationRecord' }
    OrganizationItemResponse:
      type: object
      properties:
        status: { type: string }
        message: { type: string }
        data: { $ref: '#/components/schemas/OrganizationRecord' }
    OrganizationRegistrationResponse:
      type: object
      properties:
        status: { type: string }
        message: { type: string }
        data:
          allOf:
            - $ref: '#/components/schemas/OrganizationRecord'
            - type: object
              required: [workspaceHost, workspaceUrl]
    WebPushConfigResponse:
      type: object
      properties:
        status: { type: string, example: success }
        message: { type: string }
        data: { type: string, description: Public VAPID key. }
    SubscriberInput:
      type: object
      required: [endpoint]
      properties:
        endpoint: { type: string, format: uri }
        expirationTime: { type: string, nullable: true }
        keys:
          type: object
          additionalProperties: { type: string }
        userAgent: { type: string }
        memberInfo: { type: object, additionalProperties: true }
    SubscriberListResponse:
      type: object
      properties:
        status: { type: string }
        message: { type: string }
        data:
          type: array
          items: { $ref: '#/components/schemas/SubscriberInput' }
    SubscriberItemResponse:
      type: object
      properties:
        status: { type: string }
        message: { type: string }
        data: { $ref: '#/components/schemas/SubscriberInput' }
    NotificationInput:
      type: object
      required: [title, body]
      properties:
        title: { type: string }
        body: { type: string }
        url: { type: string, format: uri }
        tag: { type: string }
    NotificationResponse:
      type: object
      properties:
        status: { type: string }
        message: { type: string }
        data:
          type: object
          additionalProperties: true
    Error:
      type: object
      properties:
        code: { type: string }
        message: { type: string }

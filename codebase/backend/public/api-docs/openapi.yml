  /auth/organization:
    get:
      tags: [Organization administration]
      summary: List organizations for the request origin
      description: Requires the auth:organization view:organization grant.
      operationId: listOrganizations
      security: [{ bearerAuth: [] }, { authCookie: [] }]
      responses:
        '200':
          description: Organization list.
          content:
            application/json:
              schema: { $ref: './schemas.yml#/components/schemas/OrganizationListResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Organization administration]
      summary: Query organizations for the request origin
      description: Requires the auth:organization view:organization grant.
      operationId: queryOrganizations
      security: [{ bearerAuth: [] }, { authCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, description: Query criteria for organization records. }
      responses:
        '200':
          description: Matching organizations.
          content:
            application/json:
              schema: { $ref: './schemas.yml#/components/schemas/OrganizationListResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    put:
      tags: [Organization administration]
      summary: Register an organization
      description: Registration is available only on the configured platform signup hostname. The organization slug determines the user's personal workspace hostname under HOSTED_DOMAIN. The organization, owner, role and permission records are created under that hostname; failures roll back the organization. Registration does not issue a session cookie on the shared signup hostname. The response includes workspaceHost and workspaceUrl, and the owner must sign in on that hostname. Returns 400 for an invalid or reserved slug, 403 on a non-platform signup host, and 409 when the slug or owner username is already in use.
      operationId: registerOrganization
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: './schemas.yml#/components/schemas/OrganizationRegistrationRequest' }
      responses:
        '201':
          description: Organization and personal workspace created. Sign in at the returned workspaceUrl.
          content:
            application/json:
              schema: { $ref: './schemas.yml#/components/schemas/OrganizationRegistrationResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /auth/organization/{id}:
    parameters: [{ $ref: '#/components/parameters/ResourceId' }]
    get:
      tags: [Organization administration]
      summary: Read an organization
      description: Requires the auth:organization view:organization grant.
      operationId: readOrganization
      security: [{ bearerAuth: [] }, { authCookie: [] }]
      responses:
        '200':
          description: Organization record.
          content:
            application/json:
              schema: { $ref: './schemas.yml#/components/schemas/OrganizationItemResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    put:
      tags: [Organization administration]
      summary: Update an organization
      description: Requires the auth:organization edit:organization grant.
      operationId: updateOrganization
      security: [{ bearerAuth: [] }, { authCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: './schemas.yml#/components/schemas/OrganizationInput' }
      responses:
        '200':
          description: Organization updated.
          content:
            application/json:
              schema: { $ref: './schemas.yml#/components/schemas/OrganizationItemResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    patch:
      tags: [Organization administration]
      summary: Unsupported for organizations
      operationId: reorderOrganizationsUnsupported
      security: [{ bearerAuth: [] }, { authCookie: [] }]
      responses:
        '405': { description: PATCH is disabled for organization records. }
    delete:
      tags: [Organization administration]
      summary: Delete an organization
      description: Requires the auth:organization delete:organization grant.
      operationId: deleteOrganization
      security: [{ bearerAuth: [] }, { authCookie: [] }]
      responses:
        '200':
          description: Organization deleted.
          content:
            application/json:
              schema: { $ref: './schemas.yml#/components/schemas/OrganizationItemResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
components:
  parameters:
    ResourceId:
      name: id
      in: path
      required: true
      schema: { type: string }
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    authCookie:
      type: apiKey
      in: cookie
      name: authorization
      description: Authorization cookie containing a Bearer JWT. Requests carrying this cookie with POST, PUT, PATCH, or DELETE require an Origin matching the request scheme and host. Credentialed CORS is restricted to that origin.
  responses:
    BadRequest:
      description: Request validation failed.
      content:
        application/json:
          schema: { $ref: './schemas.yml#/components/schemas/Error' }
    Unauthorized:
      description: Authentication is required or credentials are invalid.
      content:
        application/json:
          schema: { $ref: './schemas.yml#/components/schemas/Error' }
    NotFound:
      description: The requested record does not exist.
      content:
        application/json:
          schema: { $ref: './schemas.yml#/components/schemas/Error' }
    Forbidden:
      description: The request is forbidden for the current host or the authenticated user lacks permission for this operation.
      content:
        application/json:
          schema: { $ref: './schemas.yml#/components/schemas/Error' }
    Conflict:
      description: The request conflicts with existing data or a business rule.
      content:
        application/json:
          schema: { $ref: './schemas.yml#/components/schemas/Error' }
    ServerError:
      description: The request failed while processing the operation.
      content:
        application/json:
          schema: { $ref: './schemas.yml#/components/schemas/Error' }
    TooManyRequests:
      description: Too many authentication attempts.
      content:
        application/json:
          schema: { $ref: './schemas.yml#/components/schemas/Error' }

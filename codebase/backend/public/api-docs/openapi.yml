openapi: 3.1.0
info:
  title: Soochak API
  version: 1.0.0
  description: >-
    API documentation for authentication, current-user, user CRUD, and role CRUD
    endpoints. /auth and /me are alternative paths for the same operations.


    CRUD policy for every resource: `GET /` reads all records; `POST /` reads
    all records filtered by body parameters (a query, not a create); `PUT /`
    creates a record; `GET /{id}` reads one record; `PUT /{id}` updates it; `DELETE /{id}` deletes it; `PATCH /{id}` reorders it
    (body `{ "action": "move-up" | "move-down" }`; disabled with 405 where
    ordering is not meaningful, e.g. organizations).
servers:
  - url: https://soochak.optiwari.duckdns.org/api/v1
    description: Current API host
tags:
  - name: Authentication and current user
  - name: User administration
  - name: Role administration
  - name: Permission administration
  - name: Vendor administration
  - name: Organization administration
  - name: Web Push
paths:
  /auth:
    get:
      tags: [Authentication and current user]
      summary: View current authentication status and user details
      operationId: getAuthStatus
      security: [{ bearerAuth: [] }, { authCookie: [] }]
      responses:
        '200':
          description: Current authentication status and user details.
          content:
            application/json:
              schema: { $ref: './schemas.yml#/components/schemas/AuthAndUser' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post: &changePassword
      tags: [Authentication and current user]
      summary: Change the logged-in user's password
      operationId: changePassword
      security: [{ bearerAuth: [] }, { authCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: './schemas.yml#/components/schemas/ChangePasswordRequest' }
      responses:
        '200':
          description: Password changed successfully.
          content:
            application/json:
              schema: { $ref: './schemas.yml#/components/schemas/Message' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    put: &login
      tags: [Authentication and current user]
      summary: Log in and start a cookie session
      description: Sets the httpOnly `authorization` cookie. After 5 failed attempts per origin, username and IP the endpoint returns 429 for 60 seconds.
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: './schemas.yml#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: Login succeeded and a token was generated.
          content:
            application/json:
              schema: { $ref: './schemas.yml#/components/schemas/LoginResponse' }
        '401':
          description: Credentials are invalid.
          content:
            application/json:
              schema: { $ref: './schemas.yml#/components/schemas/Error' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
    patch: &updateProfile
      tags: [Authentication and current user]
      summary: Update the current user's profile
      operationId: updateCurrentUserProfile
      security: [{ bearerAuth: [] }, { authCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: './schemas.yml#/components/schemas/UpdateProfileRequest' }
      responses:
        '200':
          description: Profile updated.
          content:
            application/json:
              schema: { $ref: './schemas.yml#/components/schemas/AuthAndUser' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    delete: &logout
      tags: [Authentication and current user]
      summary: Log out and clear the session cookie
      description: Idempotent and callable without a session. Tokens are stateless, so this clears the httpOnly cookie rather than revoking the token server-side.
      operationId: logout
      responses:
        '204': { description: Logged out; the authorization cookie is cleared. }
  /me:
    get:
      tags: [Authentication and current user]
      summary: View current authentication status and user details
      operationId: getCurrentUserAndAuthStatus
      security: [{ bearerAuth: [] }, { authCookie: [] }]
      responses:
        '200':
          description: Current authentication status and user details.
          content:
            application/json:
              schema: { $ref: './schemas.yml#/components/schemas/AuthAndUser' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post: *changePassword
    put: *login
    patch: *updateProfile
    delete: *logout
  /auth/user:
    get:
      tags: [User administration]
      summary: List all users
      description: Each hostname is a personal workspace with only its signed-in user. Requires the `view:all` grant on `auth:user`. Password and date of birth are never returned.
      operationId: listUsers
      security: [{ bearerAuth: [] }, { authCookie: [] }]
      responses:
        '200':
          description: User list.
          content:
            application/json:
              schema: { $ref: './schemas.yml#/components/schemas/CrudListResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [User administration]
      summary: Query users
      description: Each hostname is a personal workspace with only its signed-in user. Requires `view:all` on `auth:user`. The body is an equality filter on `_id`, `user`, `email`, `role`, `sex`, `phone`, `timezone`, `name.first` or `name.last`; operators and other fields are rejected with 400.
      operationId: queryUsers
      security: [{ bearerAuth: [] }, { authCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: { oneOf: [{ type: string }, { type: number }, { type: boolean }] } }
      responses:
        '200':
          description: Matching user list.
          content:
            application/json:
              schema: { $ref: './schemas.yml#/components/schemas/CrudListResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    put:
      tags: [User administration]
      summary: User creation is unsupported
      description: Each hostname is a personal workspace for one user. Additional user accounts cannot be created in the prototype; organization registration provisions the workspace owner. The request body is ignored.
      operationId: createUser
      security: [{ bearerAuth: [] }, { authCookie: [] }]
      responses:
        '405': { description: Additional users are not supported in a personal workspace. }
  /auth/user/{id}:
    parameters: [{ $ref: '#/components/parameters/ResourceId' }]
    get:
      tags: [User administration]
      summary: Get a user by ID
      description: Requires `view:all` on `auth:user`.
      operationId: getUser
      security: [{ bearerAuth: [] }, { authCookie: [] }]
      responses:
        '200':
          description: User record.
          content:
            application/json:
              schema: { $ref: './schemas.yml#/components/schemas/CrudItemResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [User administration]
      summary: Update a user
      description: Requires `edit:all` on `auth:user`. Username and password cannot be changed here (users change their own password with `POST /me`). Only an owner can edit owners, and nobody can change their own role.
      operationId: updateUser
      security: [{ bearerAuth: [] }, { authCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: './schemas.yml#/components/schemas/UserUpdateInput' }
      responses:
        '200':
          description: User updated.
          content:
            application/json:
              schema: { $ref: './schemas.yml#/components/schemas/CrudItemResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
    patch:
      tags: [User administration]
      summary: Unsupported for users
      description: Users have no meaningful order, so reordering is rejected.
      operationId: reorderUsersUnsupported
      security: [{ bearerAuth: [] }, { authCookie: [] }]
      responses:
        '405': { description: PATCH is disabled for user records. }
    delete:
      tags: [User administration]
      summary: Delete a user
      description: Requires `delete:all` on `auth:user`. You cannot delete yourself, only an owner can delete an owner, and the last owner cannot be removed.
      operationId: deleteUser
      security: [{ bearerAuth: [] }, { authCookie: [] }]
      responses:
        '200': { description: User deleted. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /auth/role:
    get:
      tags: [Role administration]
      summary: List all roles
      operationId: listRoles
      security: [{ bearerAuth: [] }, { authCookie: [] }]
      responses:
        '200':
          description: Role list.
          content:
            application/json:
              schema: { $ref: './schemas.yml#/components/schemas/CrudListResponse' }
    post:
      tags: [Role administration]
      summary: Query roles
      description: Uses the CRUD route's request-body list/query behavior.
      operationId: queryRoles
      security: [{ bearerAuth: [] }, { authCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, description: Query criteria; fields depend on the role model. }
      responses:
        '200':
          description: Matching role list.
          content:
            application/json:
              schema: { $ref: './schemas.yml#/components/schemas/CrudListResponse' }
    put:
      tags: [Role administration]
      summary: Create a role
      operationId: createRole
      security: [{ bearerAuth: [] }, { authCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, description: Role fields depend on the role model. }
      responses:
        '201':
          description: Role created.
          content:
            application/json:
              schema: { $ref: './schemas.yml#/components/schemas/CrudItemResponse' }
  /auth/role/{id}:
    parameters: [{ $ref: '#/components/parameters/ResourceId' }]
    get:
      tags: [Role administration]
      summary: Get a role by ID
      operationId: getRole
      security: [{ bearerAuth: [] }, { authCookie: [] }]
      responses:
        '200':
          description: Role record.
          content:
            application/json:
              schema: { $ref: './schemas.yml#/components/schemas/CrudItemResponse' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Role administration]
      summary: Update a role
      operationId: updateRole
      security: [{ bearerAuth: [] }, { authCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, description: Role fields depend on the role model. }
      responses:
        '200':
          description: Role updated.
          content:
            application/json:
              schema: { $ref: './schemas.yml#/components/schemas/CrudItemResponse' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Role administration]
      summary: Reorder roles
      operationId: reorderRoles
      security: [{ bearerAuth: [] }, { authCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, description: Reordering payload consumed by CrudRoutes. }
      responses:
        '200': { description: Role order updated. }
    delete:
      tags: [Role administration]
      summary: Delete a role
      operationId: deleteRole
      security: [{ bearerAuth: [] }, { authCookie: [] }]
      responses:
        '200': { description: Role deleted. }
        '404': { $ref: '#/components/responses/NotFound' }
  /auth/permission:
    get:
      tags: [Permission administration]
      summary: List all permissions
      operationId: listPermissions
      security: [{ bearerAuth: [] }, { authCookie: [] }]
      responses:
        '200':
          description: Permission list.
          content:
            application/json:
              schema: { $ref: './schemas.yml#/components/schemas/CrudListResponse' }
    post:
      tags: [Permission administration]
      summary: Query permissions
      description: Uses CrudRoutes request-body list/query behavior.
      operationId: queryPermissions
      security: [{ bearerAuth: [] }, { authCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, description: Query criteria; fields depend on the permission model. }
      responses:
        '200':
          description: Matching permission list.
          content:
            application/json:
              schema: { $ref: './schemas.yml#/components/schemas/CrudListResponse' }
    put:
      tags: [Permission administration]
      summary: Create a permission
      operationId: createPermission
      security: [{ bearerAuth: [] }, { authCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [authorization, resource, action], properties: { authorization: { type: string, description: 'user:<name> or role:<name>' }, resource: { type: string, description: 'Resource identifier such as module:feature' }, action: { type: array, items: { type: string }, description: 'Allowed actions' } } }
      responses:
        '201':
          description: Permission created.
          content:
            application/json:
              schema: { $ref: './schemas.yml#/components/schemas/CrudItemResponse' }
  /auth/permission/{id}:
    parameters: [{ $ref: '#/components/parameters/ResourceId' }]
    get:
      tags: [Permission administration]
      summary: Get a permission by ID
      operationId: getPermission
      security: [{ bearerAuth: [] }, { authCookie: [] }]
      responses:
        '200':
          description: Permission record.
          content:
            application/json:
              schema: { $ref: './schemas.yml#/components/schemas/CrudItemResponse' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Permission administration]
      summary: Update a permission
      operationId: updatePermission
      security: [{ bearerAuth: [] }, { authCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [authorization, resource, action], properties: { authorization: { type: string, description: 'user:<name> or role:<name>' }, resource: { type: string, description: 'Resource identifier such as module:feature' }, action: { type: array, items: { type: string }, description: 'Allowed actions' } } }
      responses:
        '200':
          description: Permission updated.
          content:
            application/json:
              schema: { $ref: './schemas.yml#/components/schemas/CrudItemResponse' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Permission administration]
      summary: Reorder permissions
      operationId: reorderPermissions
      security: [{ bearerAuth: [] }, { authCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, description: Reordering payload consumed by CrudRoutes. }
      responses:
        '200': { description: Permission order updated. }
    delete:
      tags: [Permission administration]
      summary: Delete a permission
      operationId: deletePermission
      security: [{ bearerAuth: [] }, { authCookie: [] }]
      responses:
        '200': { description: Permission deleted. }
        '404': { $ref: '#/components/responses/NotFound' }
  /auth/vendor:
    get:
      tags: [Vendor administration]
      summary: List all vendors
      operationId: listVendors
      security: [{ bearerAuth: [] }, { authCookie: [] }]
      responses:
        '200':
          description: Vendor list.
          content:
            application/json:
              schema: { $ref: './schemas.yml#/components/schemas/CrudListResponse' }
    post:
      tags: [Vendor administration]
      summary: Query vendors
      description: Uses CrudRoutes request-body list/query behavior.
      operationId: queryVendors
      security: [{ bearerAuth: [] }, { authCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, description: Query criteria; fields depend on the vendor model. }
      responses:
        '200':
          description: Matching vendor list.
          content:
            application/json:
              schema: { $ref: './schemas.yml#/components/schemas/CrudListResponse' }
    put:
      tags: [Vendor administration]
      summary: Create a vendor
      operationId: createVendor
      security: [{ bearerAuth: [] }, { authCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, description: 'Vendor model fields are not defined in the current repository yet.' }
      responses:
        '201':
          description: Vendor created.
          content:
            application/json:
              schema: { $ref: './schemas.yml#/components/schemas/CrudItemResponse' }
  /auth/vendor/{id}:
    parameters: [{ $ref: '#/components/parameters/ResourceId' }]
    get:
      tags: [Vendor administration]
      summary: Get a vendor by ID
      operationId: getVendor
      security: [{ bearerAuth: [] }, { authCookie: [] }]
      responses:
        '200':
          description: Vendor record.
          content:
            application/json:
              schema: { $ref: './schemas.yml#/components/schemas/CrudItemResponse' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Vendor administration]
      summary: Update a vendor
      operationId: updateVendor
      security: [{ bearerAuth: [] }, { authCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, description: 'Vendor model fields are not defined in the current repository yet.' }
      responses:
        '200':
          description: Vendor updated.
          content:
            application/json:
              schema: { $ref: './schemas.yml#/components/schemas/CrudItemResponse' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Vendor administration]
      summary: Reorder vendors
      operationId: reorderVendors
      security: [{ bearerAuth: [] }, { authCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, description: Reordering payload consumed by CrudRoutes. }
      responses:
        '200': { description: Vendor order updated. }
    delete:
      tags: [Vendor administration]
      summary: Delete a vendor
      operationId: deleteVendor
      security: [{ bearerAuth: [] }, { authCookie: [] }]
      responses:
        '200': { description: Vendor deleted. }
        '404': { $ref: '#/components/responses/NotFound' }
  /web-push/config:
    get:
      tags: [Web Push]
      summary: Get the Web Push VAPID public key
      operationId: getWebPushConfig
      responses:
        '200':
          description: Public VAPID key for browser subscription.
          content:
            application/json:
              schema: { $ref: './schemas.yml#/components/schemas/WebPushConfigResponse' }
  /web-push/subscriber:
    get:
      tags: [Web Push]
      summary: List subscribers
      operationId: listSubscribers
      security: [{ bearerAuth: [] }, { authCookie: [] }]
      responses:
        '200':
          description: Subscriber records in the current request scope.
          content:
            application/json:
              schema: { $ref: './schemas.yml#/components/schemas/SubscriberListResponse' }
        '500': { $ref: '#/components/responses/ServerError' }
    post:
      tags: [Web Push]
      summary: Query subscribers
      description: Lists subscribers using the request body as query criteria.
      operationId: querySubscribers
      security: [{ bearerAuth: [] }, { authCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, description: Subscriber query criteria. }
      responses:
        '200':
          description: Matching subscriber records.
          content:
            application/json:
              schema: { $ref: './schemas.yml#/components/schemas/SubscriberListResponse' }
        '500': { $ref: '#/components/responses/ServerError' }
    put:
      tags: [Web Push]
      summary: Create a subscriber record
      description: Public (used by the browser SDK). Requires an https endpoint and p256dh/auth keys. Re-registering an existing endpoint updates that record and returns its id; keep the id to unsubscribe later.
      operationId: createSubscriber
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: './schemas.yml#/components/schemas/SubscriberInput' }
      responses:
        '201':
          description: Subscriber record created.
          content:
            application/json:
              schema: { $ref: './schemas.yml#/components/schemas/SubscriberItemResponse' }
        '400': { description: Invalid endpoint or missing keys. }
        '500': { $ref: '#/components/responses/ServerError' }
  /web-push/subscriber/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    get:
      tags: [Web Push]
      summary: Read a subscriber
      operationId: readSubscriber
      security: [{ bearerAuth: [] }, { authCookie: [] }]
      responses:
        '200':
          description: Subscriber record.
          content:
            application/json:
              schema: { $ref: './schemas.yml#/components/schemas/SubscriberItemResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    put:
      tags: [Web Push]
      summary: Update a subscriber
      operationId: updateSubscriber
      security: [{ bearerAuth: [] }, { authCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: './schemas.yml#/components/schemas/SubscriberInput' }
      responses:
        '200':
          description: Subscriber record updated.
          content:
            application/json:
              schema: { $ref: './schemas.yml#/components/schemas/SubscriberItemResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    patch:
      tags: [Web Push]
      summary: Unsupported for subscribers
      operationId: reorderSubscribersUnsupported
      security: [{ bearerAuth: [] }, { authCookie: [] }]
      responses:
        '405': { description: PATCH is disabled for subscriber records. }
    delete:
      tags: [Web Push]
      summary: Delete a subscriber
      description: Public (used by the browser SDK to unsubscribe with the id returned at registration).
      operationId: deleteSubscriber
      security: []
      responses:
        '200':
          description: Subscriber record deleted.
          content:
            application/json:
              schema: { $ref: './schemas.yml#/components/schemas/SubscriberItemResponse' }
  /web-push/notify:
    put:
      tags: [Web Push]
      summary: Send a notification to current subscribers
      description: Persists the notification and emits the asynchronous Web Push delivery event.
      operationId: sendWebPushNotification
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: './schemas.yml#/components/schemas/NotificationInput' }
      responses:
        '200':
          description: Notification record created and delivery event emitted.
          content:
            application/json:
              schema: { $ref: './schemas.yml#/components/schemas/NotificationResponse' }
        '500': { $ref: '#/components/responses/ServerError' }
    get:
      tags: [Web Push]
      summary: List notifications (under development)
      operationId: listNotifications
      responses:
        '502': { description: Endpoint is currently under development. }
    post:
      tags: [Web Push]
      summary: Query notifications (under development)
      operationId: queryNotifications
      responses:
        '502': { description: Endpoint is currently under development. }
    patch:
      tags: [Web Push]
      summary: Update notifications (under development)
      operationId: updateNotifications
      responses:
        '502': { description: Endpoint is currently under development. }
    delete:
      tags: [Web Push]
      summary: Delete notifications (under development)
      operationId: deleteNotifications
      responses:
        '502': { description: Endpoint is currently under development. }
  /auth/organization:
    get:
      tags: [Organization administration]
      summary: List organizations for the request origin
      operationId: listOrganizations
      security: [{ bearerAuth: [] }, { authCookie: [] }]
      responses:
        '200':
          description: Organization list.
          content:
            application/json:
              schema: { $ref: './schemas.yml#/components/schemas/OrganizationListResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Organization administration]
      summary: Query organizations for the request origin
      operationId: queryOrganizations
      security: [{ bearerAuth: [] }, { authCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, description: Query criteria for organization records. }
      responses:
        '200':
          description: Matching organizations.
          content:
            application/json:
              schema: { $ref: './schemas.yml#/components/schemas/OrganizationListResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    put:
      tags: [Organization administration]
      summary: Register an organization
      description: Registration is available only on the configured platform signup hostname. The organization slug determines the user's personal workspace hostname under HOSTED_DOMAIN. The organization, owner, role and permission records are created under that hostname; failures roll back the organization. Registration does not issue a session cookie on the shared signup hostname. The response includes workspaceHost and workspaceUrl, and the owner must sign in on that hostname. Returns 400 for an invalid or reserved slug, 403 on a non-platform signup host, and 409 when the slug or owner username is already in use.
      operationId: registerOrganization
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: './schemas.yml#/components/schemas/OrganizationRegistrationRequest' }
      responses:
        '201':
          description: Organization and personal workspace created. Sign in at the returned workspaceUrl.
          content:
            application/json:
              schema: { $ref: './schemas.yml#/components/schemas/OrganizationRegistrationResponse' }

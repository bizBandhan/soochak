services:
  soochak: # Gateway service NGINX
    image: optiwariindia/gateway:1.0.0
    restart: unless-stopped
    ports:
      - 8080:80
    volumes:
      - ./codebase/gateway/config:/etc/nginx/http.d
      - ./codebase/gateway/logs:/data/logs
    networks:
      - soochak
  frontend: # React/Vite dashboard; gateway routes non-API paths here
    image: optiwariindia/soochak-frontend:${BUILD_TARGET}-1.0.0
    build:
      context: ./codebase/frontend
      target: ${BUILD_TARGET}
    restart: unless-stopped
    volumes:
      - ./codebase/frontend/index.html:/app/index.html
      - ./codebase/frontend/package.json:/app/package.json
      - ./codebase/frontend/metadata.json:/app/metadata.json
      - ./codebase/frontend/src:/app/src
      - ./codebase/frontend/public:/app/public
      - ./codebase/frontend/tsconfig.json:/app/tsconfig.json
      - ./codebase/frontend/vite.config.ts:/app/vite.config.ts
    networks:
      - soochak
  backend: # Express JS Applciation, Core of the project
    image: optiwariindia/soochak:${BUILD_TARGET}-1.0.0
    build:
      context: ./codebase/backend
      target: ${BUILD_TARGET}
    restart: unless-stopped
    env_file:
      - ./environment/backend.env
    volumes:
      - ./codebase/backend/module:/bizbandhan/soochak/module
      - ./codebase/backend/core:/bizbandhan/soochak/core
      - ./codebase/backend/public:/bizbandhan/soochak/public
      - ./codebase/backend/package.json:/bizbandhan/soochak/package.json
    networks:
      - soochak
  db: # Mongodb, main database storage
    image: optiwariindia/mongodb
    restart: unless-stopped
    networks:
      - soochak
    volumes:
      - ./codebase/db/store:/data/db
      - ./codebase/db/config:/data/config
      - ./codebase/db/backup:/backup
networks:
  soochak: